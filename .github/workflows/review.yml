name: review

# Claude 앱 검토 경로. 루틴이 초안을 push 하거나, 사용자가 루틴 세션에서
# 수정·"게시" 를 지시해 세션이 pending.json 을 push 할 때마다 바로 돈다.
#   dmSent:false   → "초안 준비됨 + 세션 링크" 알림 DM
#   approved:true  → 채널 게시
#
# 예약(cron) 실행은 GitHub 이 붐비면 건너뛴다. 예전 poll 워크플로는 30분 간격
# 48회 중 4~6회만 돌아 답장이 몇 시간씩 처리되지 않았다 (2026-09~10 실측).
# push 이벤트는 건너뛰지 않으므로 여기서는 폴링하지 않는다.
#
# 이 워크플로가 커밋하는 push 는 GITHUB_TOKEN 이라 자기 자신을 다시 부르지 않는다.
on:
  push:
    branches: [main]
    paths: [pending.json]
  workflow_dispatch:

# collect 와 다른 그룹이다. 같은 그룹이면 대기 중인 실행이 하나만 남아,
# 뒤에 예약된 collect 가 대기 중인 게시 실행을 밀어낼 수 있다. 커밋 충돌은
# push-state.sh 의 재시도가 흡수한다.
concurrency:
  group: news-digest-review
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 트리거한 커밋이 아니라 최신 main 을 본다. 수정 push 가 연달아 오면
      # 마지막 상태만 의미가 있다.
      - uses: actions/checkout@v4
        with:
          ref: main

      # 세션이 "취소" 로 pending.json 을 지운 push 에도 걸린다. 그땐 할 일이 없다.
      - id: gate
        run: |
          if [ -f pending.json ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending.json 없음 — 건너뜁니다."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.go == 'true'
        with:
          bun-version: latest

      - name: 알림 DM 또는 게시
        if: steps.gate.outputs.go == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: bun digest.ts --sync

      - name: 커밋
        if: steps.gate.outputs.go == 'true'
        run: bash ./.github/push-state.sh "review" state.json pending.json
