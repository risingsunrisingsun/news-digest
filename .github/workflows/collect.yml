name: collect

# RSS 수집. LLM 호출이 없어 30초면 끝난다.
# 3시간 주기인 이유는 README 의 "왜 수집과 게시를 분리하는가" 참고 —
# 베리타스알파는 50건이 약 2.4시간만 커버해서, 간격을 늘리면 그만큼 놓친다.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

# 세 워크플로와 Claude 루틴이 모두 같은 파일을 커밋한다. 같은 그룹으로 묶어
# Actions 쪽 실행끼리는 직렬화하고, 루틴과의 충돌은 push 재시도로 흡수한다.
concurrency:
  group: news-digest-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 수집
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: bun digest.ts --collect

      - name: 커밋
        run: bash ./.github/push-state.sh "collect" archive.json
